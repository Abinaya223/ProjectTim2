<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Kapakana:wght@300..400&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Pecel Nusantara</title>
</head>
<body class="bg-[#FAF5F5]">
    <div id="sidebar-container"></div>

    <img src="./assets/bg/bg1.png" alt="bg" class="w-full h-screen object-cover">
    
    <nav class="absolute top-0 left-0 w-full flex items-center p-4 bg-transparent text-white z-10">
        <button id="menuBtn" class="cursor-pointer focus:outline-none">
            <i data-feather="menu" class="text-black w-8 h-8"></i>
        </button>
        <h1 class="mx-auto text-white text-6xl font-kapakana text-shadow-2xs">
            Pecel Nusantara
        </h1>
    </nav>
    
    <div id="menu-utama" class="relative flex justify-between items-center px-8 bg-white">
        <div class="flex justify-start">
            <img src="./assets/bg/logo.png" alt="Menu Kiri" class="w-35 h-35">
        </div>
        
        <div class="text-center">
            <h2 class="text-4xl font-bold text-[#7B4A29]">Main Course</h2>
        </div>
        
        <div class="flex justify-end">
            <img src="./assets/bg/logo.png" alt="Menu Kanan" class="w-35 h-35">
        </div>
    </div>

    <section id="main-course-container" class="relative py-12 grid grid-cols-1 md:grid-cols-3 gap-12 max-w-5xl mx-auto px-6">
</section>

    <footer class="w-full bg-[#7B4A29] text-white">
        <div class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
            <div class="flex flex-col items-center">
                <div class="mb-2"><i data-feather="map-pin"></i></div>
                <h3 class="font-bold text-sm tracking-wide">Pecel Nusantara</h3>
                <p class="text-xs text-amber-200/80 mt-1">Depok (Jl. Margonda Raya)</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="mb-2"><i data-feather="map-pin"></i></div>
                <h3 class="font-bold text-sm tracking-wide">Pecel Nusantara</h3>
                <p class="text-xs text-amber-200/80 mt-1">Bandung (Jl. Riau)</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="mb-2"><i data-feather="map-pin"></i></div>
                <h3 class="font-bold text-sm tracking-wide">Pecel Nusantara</h3>
                <p class="text-xs text-amber-200/80 mt-1">Jakarta (Kemang)</p>
            </div>
        </div>

        <div class="bg-[#6D320E] py-3 text-center">
            <p class="text-[10px] text-amber-200/60 font-light">
                @ Copyright 2025 PT Bintang Jaya
            </p>
        </div>
    </footer>

    <script src="./JS/index.js"></script>
    <script src="./JS/product.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
